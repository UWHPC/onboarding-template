name: UWHPC Evaluation

# Applicant submissions arrive as PRs from forks. This runs the TRUSTED
# base-branch workflow (pull_request_target); it forwards only the PR's fork URL
# + head SHA to the evaluator and reports the result as a sticky PR comment. It
# NEVER checks out or runs the PR's code on the runner — the untrusted build runs
# only in the evaluator's sandbox. Submission PRs are made drafts (unmergeable)
# but left open for iterative improvement.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: eval-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    # Only real submissions (fork PRs); internal maintenance PRs are skipped.
    if: ${{ github.event.pull_request.head.repo.fork }}
    runs-on: [self-hosted, uwhpc]
    steps:
      - name: Evaluate submission and report on the PR
        env:
          BASE_URL: ${{ vars.UWHPC_EVALUATOR_URL }}
          TOKEN: ${{ secrets.UWHPC_EVALUATOR_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          FORK_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
          ACTOR: ${{ github.event.pull_request.user.login }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "${BASE_URL:-}" ] || { echo "::error::UWHPC_EVALUATOR_URL not set"; exit 1; }
          [ -n "${TOKEN:-}" ]    || { echo "::error::UWHPC_EVALUATOR_TOKEN not set"; exit 1; }
          base="${BASE_URL%/}"
          api="https://api.github.com/repos/${REPO}"
          marker="<!-- uwhpc-eval -->"

          # 0. Make the submission PR a draft so it can't be merged (idempotent).
          draftq=$(jq -n --arg id "$PR_NODE_ID" \
            '{query:"mutation($id:ID!){convertPullRequestToDraft(input:{pullRequestId:$id}){pullRequest{isDraft}}}", variables:{id:$id}}')
          curl -sS -X POST https://api.github.com/graphql \
            -H "Authorization: Bearer ${GH_TOKEN}" -d "$draftq" >/dev/null || true

          # 1. Submit the fork + head SHA (public fork; evaluator clones it in its sandbox)
          body=$(jq -n --arg repo "${FORK_URL%.git}" --arg sha "$HEAD_SHA" \
                       --arg actor "$ACTOR" --arg run "$RUN_ID" \
                 '{repo_url:$repo, commit_sha:$sha, github_actor:$actor, github_run_id:$run}')
          submit=$(curl -sS -X POST "${base}/v1/evaluations" \
                     -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" -d "$body")
          job_id=$(printf '%s' "$submit" | jq -r '.job_id // empty')
          [ -n "$job_id" ] || { echo "::error::submission failed: $submit"; exit 1; }
          echo "job: $job_id"

          # 2. Poll for a terminal result (5s x 180 = 15 min)
          status="unknown"; result="{}"
          for _ in $(seq 1 180); do
            result=$(curl -sS "${base}/v1/evaluations/${job_id}/results" -H "Authorization: Bearer ${TOKEN}" || echo '{}')
            status=$(printf '%s' "$result" | jq -r '.status // "unknown"')
            case "$status" in completed|failed_build|failed_tests|failed_benchmark|timed_out|internal_error) break;; esac
            sleep 5
          done

          # 3. Extract fields and build a clean report
          build=$(printf '%s' "$result" | jq -r '.build.status // "n/a"')
          vis=$(printf '%s'   "$result" | jq -r '.tests.visible // "n/a"')
          hid=$(printf '%s'   "$result" | jq -r '.tests.hidden // "n/a"')
          rt=$(printf '%s'    "$result" | jq -r '.benchmark.runtime_ms // "n/a"')
          mem=$(printf '%s'   "$result" | jq -r '.benchmark.memory_mb // "n/a"')
          score=$(printf '%s' "$result" | jq -r '.benchmark.score // "n/a"')
          pretty=$(printf '%s' "$result" | jq . 2>/dev/null || printf '%s' "$result")
          now=$(date -u +"%Y-%m-%d %H:%M UTC")
          msg=$(printf '%s' "$result" | jq -r '.error_message // empty')
          unit() { if [ "$1" = "n/a" ]; then printf 'n/a'; else printf '%s %s' "$1" "$2"; fi; }
          rt_s=$(unit "$rt" "ms"); mem_s=$(unit "$mem" "MB")

          # Score is measured against a reference baseline (score = reference_ms /
          # your_ms, so 1.0 ties the baseline). A submission must score OVER 0.9 to
          # pass; below that, the check fails and we surface the reason on the PR.
          THRESHOLD=0.9
          score_ok=1
          if [ "$status" = "completed" ] && [ "$score" != "n/a" ]; then
            awk "BEGIN{exit !($score < $THRESHOLD)}" && score_ok=0 || true
          fi

          # Status line; on a failure, add the grader's one-line hint as a
          # blockquote right below it (a coarse category, never the exact hidden
          # case or how to fix it). The blank lines that separate it from the
          # table come from the format string below -- $() strips trailing
          # newlines, so relying on them here would merge the table into the
          # blockquote.
          status_block="**Status:** ${status}"
          if [ -n "$msg" ] && [ "$status" != "completed" ]; then
            status_block=$(printf '**Status:** %s\n\n> %s' "$status" "$msg")
          elif [ "$score_ok" = "0" ]; then
            status_block=$(printf '**Status:** %s (below threshold)\n\n> Score %s is below the required 0.9 — your submission must be within 90%% of the reference baseline to pass. Keep optimizing and push again.' "$status" "$score")
          fi

          report=$(printf '## UWHPC Evaluation\n\n%s\n\n| Stage | Result |\n| --- | --- |\n| Build | %s |\n| Public tests | %s |\n| Hidden tests | %s |\n| Runtime | %s |\n| Memory | %s |\n| Score | %s |\n\n> **Score** is measured against a reference baseline (`score = reference_ms / your_ms`), so **1.0** ties the baseline and higher is faster. You need a score **over 0.9** to pass — anything below marks this check as failing.\n\n<sub>Job `%s` · updated %s</sub>\n' \
            "$status_block" "$build" "$vis" "$hid" "$rt_s" "$mem_s" "$score" "$job_id" "$now")
          details=$(printf '\n<details><summary>Raw result</summary>\n\n```json\n%s\n```\n</details>\n' "$pretty")

          # On a build failure, show the compiler/build output so the applicant
          # can fix it (their own code -- safe to reveal).
          buildlog=$(printf '%s' "$result" | jq -r '.build.log // empty')
          buildblock=""
          if [ -n "$buildlog" ]; then
            buildblock=$(printf '\n<details><summary>Build output</summary>\n\n```\n%s\n```\n</details>\n' "$buildlog")
          fi

          # Per-run benchmark timings (for debugging run-to-run variance).
          runs=$(printf '%s' "$result" | jq -r '
            (.benchmark_runs // empty) as $b
            | if ($b != null) and (($b.submission_ms // null) | type == "array") then
                "\n<details><summary>Per-run benchmark timings</summary>\n\n| Run | Submission ms | Reference ms |\n| --- | --- | --- |\n"
                + ([ $b.submission_ms | to_entries[] | "| \(.key + 1) | \(.value) | \($b.reference_ms[.key]) |" ] | join("\n"))
                + "\n\n</details>\n"
              else "" end' 2>/dev/null || printf '')

          # 4. Sticky comment: update ours if present, else create
          payload=$(jq -n --arg b "$(printf '%s\n%s\n%s\n%s\n%s' "$marker" "$report" "$buildblock" "$details" "$runs")" '{body:$b}')
          cid=$(curl -sS "${api}/issues/${PR_NUMBER}/comments?per_page=100" \
                  -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                | jq -r --arg m "$marker" '[.[] | select(.body | contains($m))][0].id // empty' || echo '')
          if [ -n "$cid" ]; then
            curl -sS -X PATCH "${api}/issues/comments/${cid}" \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -d "$payload" >/dev/null
          else
            curl -sS -X POST "${api}/issues/${PR_NUMBER}/comments" \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -d "$payload" >/dev/null
          fi

          # 5. Mirror the report to the run's Summary tab
          printf '%s\n%s\n%s\n%s\n' "$report" "$buildblock" "$details" "$runs" >> "$GITHUB_STEP_SUMMARY"

          # 6. Reflect pass/fail as the check status (PR stays open for iteration)
          [ "$status" = "completed" ] || { echo "::error::status=${status}"; exit 1; }
          [ "$score_ok" = "1" ] || { echo "::error::score ${score} is below the required 0.9 threshold"; exit 1; }
          echo "Evaluation passed."
